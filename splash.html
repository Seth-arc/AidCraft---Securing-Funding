<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splash Redirect</title>
    <meta http-equiv="refresh" content="0; url=index.html">
    <script>
        window.location.replace(new URL('index.html', document.baseURI).toString());
    </script>
</head>
<body>
    <p>Redirecting to the splash screen...</p>
</body>
</html>
