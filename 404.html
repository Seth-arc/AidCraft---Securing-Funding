<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <meta name="robots" content="noindex">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #f4fbf8 0%, #e2f5ef 100%);
            color: #1f3a32;
        }

        main {
            width: min(560px, calc(100% - 32px));
            padding: 32px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 18px 50px rgba(2, 100, 71, 0.14);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 12px;
            color: #026447;
        }

        p {
            line-height: 1.6;
            margin-bottom: 20px;
        }

        a {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 999px;
            background: #026447;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <main>
        <h1>Page not found</h1>
        <p>This static GitHub Pages build only serves the repository files directly. Redirecting you back to the main experience.</p>
        <a href="index.html">Return to the platform</a>
    </main>
    <script>
        setTimeout(() => {
            const pathSegments = window.location.pathname.split('/').filter(Boolean);
            const isProjectPages = window.location.hostname.endsWith('github.io') && pathSegments.length > 1;
            const baseUrl = isProjectPages
                ? `${window.location.origin}/${pathSegments[0]}/`
                : `${window.location.origin}/`;

            window.location.replace(new URL('index.html', baseUrl).toString());
        }, 1800);
    </script>
</body>
</html>
